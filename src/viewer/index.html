<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot-in-a-Box — 3D Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a12; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a12; color: #e0e0e0; z-index: 100;
    }
    #loading.hidden { display: none; }
    #loading h1 { font-size: 1.5rem; margin-bottom: 1rem; font-weight: 400; }
    #progress-bar {
      width: 300px; height: 4px; background: #333;
      border-radius: 2px; overflow: hidden;
    }
    #progress-fill {
      height: 100%; width: 0%; background: #4a9eff;
      transition: width 0.3s ease;
    }
    #progress-text { margin-top: 0.5rem; font-size: 0.85rem; color: #888; }

    #controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px;
      background: rgba(20, 20, 40, 0.9); padding: 12px 20px;
      border-radius: 12px; backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    #controls.hidden { display: none; }

    .ctrl-btn {
      background: rgba(74, 158, 255, 0.15); border: 1px solid rgba(74, 158, 255, 0.3);
      color: #4a9eff; padding: 8px 16px; border-radius: 8px;
      cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    .ctrl-btn:hover { background: rgba(74, 158, 255, 0.3); }
    .ctrl-btn.active { background: rgba(74, 158, 255, 0.4); border-color: #4a9eff; }

    #scrubber {
      width: 200px; accent-color: #4a9eff;
    }
    #time-label { color: #888; font-size: 0.8rem; min-width: 40px; }

    #info {
      position: fixed; top: 20px; left: 20px;
      color: #888; font-size: 0.8rem; z-index: 10;
    }
    #part-label {
      position: fixed; top: 20px; right: 20px;
      color: #4a9eff; font-size: 0.9rem; z-index: 10;
      background: rgba(20, 20, 40, 0.8); padding: 6px 12px;
      border-radius: 6px; display: none;
    }

    #lighting-panel {
      position: fixed; top: 20px; right: 20px;
      background: rgba(20, 20, 40, 0.92); padding: 14px 18px;
      border-radius: 10px; backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20; min-width: 200px; display: none;
    }
    #lighting-panel.visible { display: block; }
    #lighting-panel h3 {
      color: #4a9eff; font-size: 0.8rem; margin: 0 0 10px 0;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .slider-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .slider-row label {
      color: #aaa; font-size: 0.75rem; min-width: 64px;
    }
    .slider-row input[type="range"] {
      flex: 1; accent-color: #4a9eff; height: 4px;
    }
    .slider-row .val {
      color: #666; font-size: 0.7rem; min-width: 28px; text-align: right;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Loading Robot-in-a-Box...</h1>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-text">Initializing...</div>
  </div>

  <div id="controls" class="hidden">
    <button class="ctrl-btn" id="btn-play" title="Play/Pause">&#9654; Play</button>
    <button class="ctrl-btn" id="btn-reset" title="Reset to folded">&#8635; Reset</button>
    <input type="range" id="scrubber" min="0" max="1000" value="0" step="1">
    <span id="time-label">0.0s</span>
    <button class="ctrl-btn" id="btn-speed" title="Change speed">1x</button>
    <button class="ctrl-btn" id="btn-lighting" title="Lighting settings">&#9728;</button>
  </div>

  <div id="lighting-panel">
    <h3>Lighting &amp; Display</h3>
    <div class="slider-row">
      <label>Exposure</label>
      <input type="range" id="sl-exposure" min="0" max="200" value="60" step="1">
      <span class="val" id="val-exposure">1.2</span>
    </div>
    <div class="slider-row">
      <label>Contrast</label>
      <input type="range" id="sl-contrast" min="0" max="200" value="100" step="1">
      <span class="val" id="val-contrast">1.0</span>
    </div>
    <div class="slider-row">
      <label>Key Light</label>
      <input type="range" id="sl-key" min="0" max="200" value="100" step="1">
      <span class="val" id="val-key">2.0</span>
    </div>
    <div class="slider-row">
      <label>Fill Light</label>
      <input type="range" id="sl-fill" min="0" max="200" value="100" step="1">
      <span class="val" id="val-fill">0.5</span>
    </div>
    <div class="slider-row">
      <label>Ambient</label>
      <input type="range" id="sl-ambient" min="0" max="200" value="100" step="1">
      <span class="val" id="val-ambient">0.4</span>
    </div>
    <div class="slider-row">
      <label>Env Map</label>
      <input type="range" id="sl-env" min="0" max="200" value="100" step="1">
      <span class="val" id="val-env">1.0</span>
    </div>
  </div>

  <div id="info" style="color: rgba(255,255,255,0.3); font-size: 0.7rem; letter-spacing: 0.5px;">
    Scroll to zoom &middot; Drag to rotate &middot; Right-drag to pan
  </div>
  <div id="part-label"></div>

  <!-- Product title overlay -->
  <div id="title-overlay" style="
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 15; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.5s ease;
  ">
    <div style="color: rgba(255,255,255,0.9); font-size: 2.2rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase;">
      Robot-in-a-Box
    </div>
    <div style="color: rgba(130,160,255,0.6); font-size: 0.85rem; font-weight: 400; letter-spacing: 2px; margin-top: 8px;">
      Autonomous Workstation
    </div>
  </div>

  <div id="step-label" style="
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.75); font-size: 0.85rem; font-weight: 300;
    letter-spacing: 1.5px; text-transform: uppercase; z-index: 10;
    background: none; padding: 8px 20px;
    display: none; text-align: center;
    transition: opacity 0.5s ease;
  "></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
